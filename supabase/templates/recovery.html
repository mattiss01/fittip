<h2>Reset your FitTip password</h2>

<p>
  Someone asked to set a new password for this address. If that was you, open
  the link below. It works once, on any device.
</p>

<p>
  <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}"
    >Set a new password</a
  >
</p>

<p>If it was not you, do nothing: your password stays as it is.</p>
