name: CI

# Mirrors the quality, database, and browser commands documented in README.md
# so a ticket branch proves itself before independent review, instead of every
# agent re-running the same suites in its own session.

on:
  push:
    branches: [master, "ticket/**", "chore/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Superseding an in-flight branch run saves minutes and costs nothing. Doing the
# same on `master` would leave a merge commit with no completed run, which the
# working agreement treats as a delivery blocker, so never cancel there.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  static:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shape-valid placeholders only. No Supabase project exists behind these;
      # they exist so the environment validator and `next build` can run without
      # the Docker stack. Jobs that need real coordinates derive them below.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test:run

      - name: Next production build
        run: npm run build

  database:
    name: Migrations, RLS, advisors, concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Derive local Supabase coordinates
        run: node .github/scripts/supabase-env.mjs

      - name: Apply every migration from zero
        run: npx supabase db reset --local

      - name: Database lint
        run: npx supabase db lint --local --level warning --fail-on warning

      - name: Security and performance advisors
        run: npx supabase db advisors --local --type all --level warn --fail-on warn

      - name: pgTAP authorization and constraint tests
        run: npx supabase test db --local supabase/tests/database

      - name: M1-01 concurrent plan writes
        run: npm run test:m1-01-concurrency

      - name: M2-01 concurrent goal mutations
        run: npm run test:m2-01-concurrency

      - name: M2-01 concurrent reorder and lifecycle
        run: npm run test:m2-01-concurrency-lifecycle

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  browser:
    name: 390px production browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Derive local Supabase coordinates
        run: node .github/scripts/supabase-env.mjs

      - name: Apply every migration from zero
        run: npx supabase db reset --local

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so the build must happen after the real coordinates are derived.
      - name: Next production build
        run: npm run build

      # Each step writes to its own artifact directories. Playwright clears its
      # output directory when it starts, so a shared one would let a later step
      # destroy the trace of an earlier failure - which is what happened once
      # the later steps were allowed to run after a failure.
      #
      # Every browser step runs one worker at a time. A shared runner also hosts
      # the Supabase stack and the application server, so parallel workers make
      # these flows slower and less deterministic than the documented local run.
      #
      # The root config's 60s test timeout is raised here for the same reason.
      # The per-ticket configs already set their own longer timeouts and are
      # deliberately left alone.
      #
      # This step alone retries. `planning.spec.ts` opens `/home/plan` through
      # the App Router transition that M2-09 tracks: the segment intermittently
      # never replaces its loading boundary, which M2-06 made detectable and
      # nobody has yet explained. Measured at roughly one run in five, it
      # reddened seven of the last thirty-five runs on commits that touched no
      # application code, which teaches every reader to re-run instead of read.
      #
      # Two retries absorb intermittency, not breakage. A plan surface that is
      # genuinely broken fails all three attempts and still blocks the job; only
      # a defect that passes on a re-draw is let through, and Playwright reports
      # it as `flaky` rather than swallowing it, so M2-09 keeps accruing its
      # rate from continuous integration instead of losing every occurrence to a
      # red job. Remove this the moment M2-09 lands a fix - the retry count is
      # the measurement, so a run that stops reporting flaky is the evidence.
      #
      # Deliberately scoped to this step. The other browser steps do not carry
      # this defect and must keep failing on the first attempt.
      - name: Authentication and planning flows
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/auth-planning
        run: |
          .github/scripts/with-server.sh 3000 \
            npx playwright test e2e/auth.spec.ts e2e/planning.spec.ts \
              --workers=1 --timeout=180000 --retries=2 \
              --trace=retain-on-failure \
              --output=test-results/auth-planning

      - name: M1-03 quick logging
        # Report every broken flow in one run, not just the first.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/m1-03
        run: |
          .github/scripts/with-server.sh 3013 \
            npx playwright test --config=e2e/m1-03.playwright.config.ts \
              --workers=1 --trace=retain-on-failure --output=test-results/m1-03

      - name: M1-04 Today and Progress
        # Report every broken flow in one run, not just the first.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/m1-04
        run: |
          .github/scripts/with-server.sh 3014 \
            npx playwright test --config=e2e/m1-04.playwright.config.ts \
              --workers=1 --trace=retain-on-failure --output=test-results/m1-04

      - name: M2-01 goal management
        # Report every broken flow in one run, not just the first.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/m2-01
        run: |
          .github/scripts/with-server.sh 3015 \
            npx playwright test --config=e2e/m2-01.playwright.config.ts \
              --workers=1 --trace=retain-on-failure --output=test-results/m2-01

      - name: M2-02 memory management
        # Report every broken flow in one run, not just the first.
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/m2-02
        run: |
          .github/scripts/with-server.sh 3016 \
            npx playwright test --config=e2e/m2-02.playwright.config.ts \
              --workers=1 --trace=retain-on-failure --output=test-results/m2-02

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
